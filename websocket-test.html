<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Connection Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #fff; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #333; border-radius: 5px; }
        .status { font-weight: bold; }
        .connected { color: #4ade80; }
        .disconnected { color: #ef4444; }
        .message { background: #2a2a2a; padding: 5px; margin: 5px 0; border-radius: 3px; }
        button { background: #3b82f6; color: white; border: none; padding: 8px 16px; margin: 5px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>
    <h1>🔌 WebSocket Connection Test</h1>
    
    <div class="section">
        <h3>Raw WebSocket (/ws)</h3>
        <div id="ws-status" class="status disconnected">Disconnected</div>
        <button onclick="connectRawWS()">Connect</button>
        <button onclick="testRawWS()">Send Test Message</button>
        <div id="ws-messages"></div>
    </div>
    
    <div class="section">
        <h3>Socket.IO</h3>
        <div id="io-status" class="status disconnected">Disconnected</div>
        <button onclick="connectSocketIO()">Connect</button>
        <button onclick="testSocketIO()">Send Test Alert</button>
        <div id="io-messages"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const BASE_URL = window.location.origin;
        let rawWS = null;
        let socketIO = null;
        
        function addMessage(containerId, message) {
            const container = document.getElementById(containerId);
            const div = document.createElement('div');
            div.className = 'message';
            div.innerHTML = `<small>${new Date().toLocaleTimeString()}</small><br>${message}`;
            container.insertBefore(div, container.firstChild);
            
            // Keep only last 10 messages
            while (container.children.length > 10) {
                container.removeChild(container.lastChild);
            }
        }
        
        function connectRawWS() {
            if (rawWS) {
                rawWS.close();
            }
            
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;
            
            rawWS = new WebSocket(wsUrl);
            
            rawWS.onopen = () => {
                document.getElementById('ws-status').textContent = 'Connected';
                document.getElementById('ws-status').className = 'status connected';
                addMessage('ws-messages', '✅ Connected to raw WebSocket');
            };
            
            rawWS.onmessage = (event) => {
                const data = JSON.parse(event.data);
                addMessage('ws-messages', `📨 ${JSON.stringify(data, null, 2)}`);
            };
            
            rawWS.onclose = () => {
                document.getElementById('ws-status').textContent = 'Disconnected';
                document.getElementById('ws-status').className = 'status disconnected';
                addMessage('ws-messages', '❌ Disconnected from raw WebSocket');
            };
            
            rawWS.onerror = (error) => {
                addMessage('ws-messages', `🚨 WebSocket error: ${error}`);
            };
        }
        
        function testRawWS() {
            if (rawWS && rawWS.readyState === WebSocket.OPEN) {
                rawWS.send(JSON.stringify({
                    type: 'test_alert',
                    timestamp: new Date().toISOString()
                }));
                addMessage('ws-messages', '📤 Sent test alert');
            } else {
                addMessage('ws-messages', '❌ WebSocket not connected');
            }
        }
        
        function connectSocketIO() {
            if (socketIO) {
                socketIO.disconnect();
            }
            
            socketIO = io(BASE_URL);
            
            socketIO.on('connect', () => {
                document.getElementById('io-status').textContent = 'Connected';
                document.getElementById('io-status').className = 'status connected';
                addMessage('io-messages', '✅ Connected to Socket.IO');
            });
            
            socketIO.on('disconnect', () => {
                document.getElementById('io-status').textContent = 'Disconnected';
                document.getElementById('io-status').className = 'status disconnected';
                addMessage('io-messages', '❌ Disconnected from Socket.IO');
            });
            
            socketIO.on('status', (data) => {
                addMessage('io-messages', `📊 Status: ${JSON.stringify(data, null, 2)}`);
            });
            
            socketIO.on('alert', (data) => {
                addMessage('io-messages', `🚨 Alert: ${JSON.stringify(data, null, 2)}`);
            });
        }
        
        function testSocketIO() {
            if (socketIO && socketIO.connected) {
                socketIO.emit('test_alert', {
                    type: 'manual_test',
                    timestamp: new Date().toISOString()
                });
                addMessage('io-messages', '📤 Sent test alert via Socket.IO');
            } else {
                addMessage('io-messages', '❌ Socket.IO not connected');
            }
        }
        
        // Auto-connect on page load
        setTimeout(() => {
            connectRawWS();
            connectSocketIO();
        }, 1000);
    </script>
</body>
</html>
